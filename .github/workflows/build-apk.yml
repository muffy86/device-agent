name: build-apk

# Builds a signed release APK on a GitHub runner. The phone never compiles.
# Skips itself cleanly until apps/mobile/android exists, so CI stays green today.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'version name, e.g. 0.2.0'
        required: true
        default: '0.2.0'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for the Android project
        id: probe
        run: |
          if [ -d apps/mobile/android ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::apps/mobile/android does not exist yet — see docs/ANDROID.md Path A (npx cap add android). Skipping build."
          fi

      - uses: actions/setup-node@v4
        if: steps.probe.outputs.present == 'true'
        with: { node-version: 20 }

      - uses: actions/setup-java@v4
        if: steps.probe.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: 17

      - name: Sync web assets into the shell
        if: steps.probe.outputs.present == 'true'
        run: |
          npm install --no-audit --no-fund
          npx cap sync android || true

      - name: Decode keystore
        if: steps.probe.outputs.present == 'true'
        env: { KEYSTORE_BASE64: '${{ secrets.KEYSTORE_BASE64 }}' }
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing — see docs/ANDROID.md"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > apps/mobile/android/release.jks

      - name: Assemble release
        if: steps.probe.outputs.present == 'true'
        working-directory: apps/mobile/android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/apps/mobile/android/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --no-daemon

      - name: Collect the APK
        if: steps.probe.outputs.present == 'true'
        run: |
          find apps/mobile/android -name '*.apk' -path '*release*' -exec cp {} ./device-agent.apk \;
          ls -la device-agent.apk
          sha256sum device-agent.apk > device-agent.apk.sha256
          # Publish the hash in the release notes: it is the same trust story as the ledger.

      - uses: actions/upload-artifact@v4
        if: steps.probe.outputs.present == 'true'
        with:
          name: device-agent-apk
          path: |
            device-agent.apk
            device-agent.apk.sha256

      - uses: softprops/action-gh-release@v2
        if: steps.probe.outputs.present == 'true' && startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            device-agent.apk
            device-agent.apk.sha256
          body: |
            Signed release APK. Verify with `sha256sum -c device-agent.apk.sha256`.
            This build logs every agent action to a hash-chained ledger — run
            `device-agent --verify` to check it yourself.