name: build-apk

# Produces a signed release APK on a GitHub runner. The phone never compiles.
# No Gradle wrapper is committed; the runner supplies Gradle, so there is no
# binary blob in the repo and nothing to trust.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'version name, e.g. 0.2.0'
        required: true
        default: '0.2.0'

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: "Cache npm-free build (no npm needed: the client is an asset dir)"
        run: echo "web assets come from apps/web via sourceSets.assets.srcDirs"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing — see docs/ANDROID.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks

      - name: Build signed release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$PWD/release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Collect, hash, and verify the APK
        working-directory: apps/mobile/android
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" /tmp/device-agent.apk
          sha256sum /tmp/device-agent.apk | tee /tmp/device-agent.apk.sha256
          ls -la /tmp/device-agent.apk

      - uses: actions/upload-artifact@v4
        with:
          name: device-agent-apk
          path: |
            /tmp/device-agent.apk
            /tmp/device-agent.apk.sha256

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            /tmp/device-agent.apk
            /tmp/device-agent.apk.sha256
          body: |
            Signed release APK for `${{ github.ref_name }}`.

            Verify before installing:

                sha256sum -c device-agent.apk.sha256

            The app writes every agent action to a hash-chained ledger on your
            device; `device-agent --verify` in the CLI checks the same chain.
